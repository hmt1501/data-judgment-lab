name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Install worker dependencies
        run: npm ci
        working-directory: worker
      - name: Test worker
        run: npm test
        working-directory: worker
      - name: Build site
        run: npm run build
        env:
          # URL Worker (Settings → Secrets and variables → Actions → Variables). Không đặt = ẩn tính năng hỏi AI.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

  # Chỉ chạy khi đã thêm secret CLOUDFLARE_API_TOKEN và CLOUDFLARE_ACCOUNT_ID.
  deploy-worker:
    runs-on: ubuntu-24.04
    needs: build
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v7
      - name: Set up Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Deploy worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply data-judgment-lab --remote
